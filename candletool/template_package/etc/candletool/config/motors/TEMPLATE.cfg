; Motor configuration template for MD and MDCO drives
;
; Lists every key candletool reads, in the order 'config download' writes them.
; Units are SI and the same for MD and MDCO; enums are written by name.
;
;   critical - must be set, the upload is refused when it is missing
;   normal   - may be left out, the default shown is written and a warning is printed
;
; Critical keys are left empty here. To make a new motor file: copy this file, name it
; <Vendor>/<Model>.cfg, fill in the critical keys, drop the normal keys that keep
; their default, and delete these comments.
;
; Comments are lines starting with ';'. A line starting with '#' is not a comment, and text
; after a value on the same line becomes part of the value.
;
; Check a file with: candletool md config verify <file>

[motor]
; Name stored on the drive, at most 23 characters. Normal, default: MD
name = MD
; Rotor pole pairs (number of magnets / 2). 1 to 500. Critical
pole pairs =
; Speed constant [rpm/V], whole number, 0 to 10000. Normal, default: 0
; KV or the torque constant must be above 0, a 0 is not written. When both are set, KV is
; written first and the torque constant second, so the torque constant takes priority.
KV = 0
; Torque constant [Nm/A], 0 to 500. A 0 is not written. Normal, default: 0
torque constant = 0.0
; Rated (continuous) phase current [A] from the motor datasheet, 0 to 1000. MDCO only for now:
; the CANopen current objects in permille are relative to it. With 0 the max current is used
; as the rated value and upload prints a warning. Normal, default: 0
rated current = 0.0
; Rated (continuous) torque at the output shaft [Nm] from the datasheet, 0 to 1000. MDCO only
; for now: the CANopen torque objects (target, actual, max) in permille are relative to it.
; With 0 the max torque is used as the rated value and upload prints a warning.
; Normal, default: 0
rated torque = 0.0
; Maximum phase current [A], 0.1 to 1000. Critical
max current =
; Shaft revolutions per motor revolution, 0.001 to 1000. A 6:1 reducer is 0.166667, a 1:2
; multiplier is 2. Critical
gear ratio =
; Current loop bandwidth [Hz], 50 to 2000. Critical
torque bandwidth =
; Motor calibration mode: FULL, NOPPDET (skips pole pair detection). Normal, default: FULL
calibration mode = FULL
; Motor temperature that shuts the drive down [degC], 25 to 127. Normal, default: 80
shutdown temp = 80

[output encoder]
; Output encoder type: NONE, ME_AM_CENTER, ME_AM_OFFAXIS, RLS_17B_RS422, CM_OFFAXIS,
; M24B_CENTER, M24B_OFFAXIS, DUAL_ENCODER, ONBOARD, RLS_17B_SPI, RLS_ORBIS_RS422, CE300,
; RLS_MB022, AR50. With NONE the other keys of this section are ignored.
; Normal, default: NONE
output encoder = NONE
; Output encoder direction, 1 or -1. Normal, default: 1
output encoder dir = 1.0
; Output encoder mode: NONE, STARTUP, MOTION, REPORT, MAIN, CALIBRATED_REPORT, DUAL
; Normal, default: NONE
output encoder mode = NONE
; Output encoder calibration mode: FULL, DIRONLY. Normal, default: FULL
output encoder calibration mode = FULL

[main encoder]
; Main encoder type, same names as the output encoder type. Normal, default: ONBOARD
main encoder = ONBOARD
; Main encoder direction, 1 or -1. A 0 is not written and the drive keeps its own.
; Normal, default: 0
dir = 0.0

[position PID]
; Position error [rad] in, velocity target [rad/s] out. 0 to 100000 each. Normal, default: 0
kp = 0.0
ki = 0.0
kd = 0.0
; Limit of the integral term, 0 to 100000. Normal, default: 0
windup = 0.0

[velocity PID]
; Velocity error [rad/s] in, torque [Nm] out. 0 to 100000 each. Normal, default: 0
kp = 0.0
ki = 0.0
kd = 0.0
; Limit of the integral term, 0 to 100000. Normal, default: 0
windup = 0.0

[impedance PD]
; Position [rad] and velocity [rad/s] error in, torque [Nm] out. 0 to 100000 each.
; Normal, default: 0
kp = 0.0
kd = 0.0

[limits]
; Maximum torque [Nm], 0.1 to 1000. Critical
max torque =
; Position limits [rad], max 0 to 10000, min -10000 to 0. Both 0 turns the limit off.
; Normal, default: 0
max position = 0.0
min position = 0.0
; Maximum velocity [rad/s], 0.0001 to 1500. Critical
max velocity =
; Maximum acceleration and deceleration [rad/s^2], 0.0001 to 10000. Normal, default: 100
max acceleration = 100.0
max deceleration = 100.0

[profile]
; Profile acceleration, deceleration and quick stop deceleration [rad/s^2], 0.0001 to 10000.
; Normal, default: 100
acceleration = 100.0
deceleration = 100.0
quick stop deceleration = 100.0
; Distance from the target position that counts as reached [rad]. Normal, default: 0.1
position window = 0.1
; Distance from the target velocity that counts as reached [rad/s]. MDCO stores it in 16 bits,
; so at most 0.41 rad/s there. Normal, default: 0.4
velocity window = 0.4

[GPIO]
; GPIO mode: OFF, BRAKE, GPIO_INPUT. Normal, default: OFF
mode = OFF

[sensors]
; Torque sensor type: OFF, XJC. Normal, default: OFF
torque = OFF

; ---- Legacy ---------------------------------------------------------------------------------
; The keys below matter only for MD firmware v2.5.4 and older. Each is written only when it is
; in the file; leaving it out keeps the drive's value.

[profile]
; Profile velocity [rad/s], 0.0001 to 10000, at most limits.max velocity.
velocity = 10.0

[hardware]
; Current shunt resistance [ohm], 0.0002 to 0.01. A property of the drive board, MD20 is 0.004
; and MD80 is 0.001. Never written to MDCO.
shunt resistance =
